<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image preview</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <header class="preview-header">
      <div class="title-copy">
        <strong id="image-name">Image preview</strong>
        <span id="image-meta">Loading…</span>
      </div>
      <nav class="header-actions" aria-label="Preview actions">
        <a id="source-link" class="header-button" href="#" hidden>Return to source</a>
        <a id="original-link" class="header-button" href="#" target="_blank" rel="noopener noreferrer" hidden>
          Open original
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M8 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3M11 3h6v6M9 11l8-8"/></svg>
        </a>
      </nav>
    </header>

    <main id="preview-stage" class="preview-stage">
      <button id="image-button" class="image-button" type="button" aria-label="Toggle actual image size" aria-pressed="false" disabled>
        <img id="preview-image" alt="" referrerpolicy="no-referrer">
      </button>
      <video id="preview-video" class="preview-video" controls preload="metadata" playsinline hidden></video>
      <div id="loading-message" class="state-message">Loading image…</div>
      <div id="error-message" class="state-message error" role="alert" hidden></div>
    </main>

    <footer id="preview-footer" class="preview-footer">
      Click the image, or focus it and press Enter or Space, to switch between fit-to-window and actual size.
    </footer>

    <script src="../shared/core.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
