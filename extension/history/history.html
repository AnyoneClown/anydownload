<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyDownload — Downloads</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="history.css">
  </head>
  <body class="downloads-page">
    <a class="skip-link" href="#main-content">Skip to downloads</a>
    <div class="workspace-header">
      <div class="app-brand"><img src="../icons/image-downloader-illustrated-v2-96.png" alt="" width="32" height="32"><span>AnyDownload</span></div>
      <nav class="workspace-nav" aria-label="Workspace">
        <a class="nav-link" data-source-link href="../popup/popup.html" hidden><svg aria-hidden="true" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2"/><circle cx="7" cy="7" r="1"/><path d="m3 14 4-4 3 3 3-3 4 4"/></svg>Media</a>
        <a class="nav-link current" data-source-link href="../history/history.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 3v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg>Downloads</a>
        <a class="nav-link" data-source-link href="../tracking/tracking.html"><svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>Trackers</a>
      </nav>
      <div class="workspace-utilities" role="group" aria-label="Account and integrations">
        <a class="utility-button" aria-label="Account" title="Account" data-source-link href="../sync/sync.html"><svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="6" r="3"/><path d="M4 17v-2a6 6 0 0 1 12 0v2"/></svg></a>
        <a class="utility-button" aria-label="Integrations" title="Integrations" data-source-link href="../integrations/integrations.html"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M7 2v4m6-4v4M5 6h10v4a5 5 0 0 1-10 0V6m5 9v3"/></svg></a>
      </div>
    </div>
    <main id="main-content" class="page-shell" tabindex="-1">
      <header class="page-header">
        <div class="header-copy">
          <h1>Downloads</h1>
          <p id="dashboard-subtitle" class="private-context" hidden></p>
        </div>
        <div class="header-actions">
          <button id="open-folder-button" class="quiet-button" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M2 6V4h6l2 2h8v10H2V6Z"/></svg>Open folder</button>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh downloads" title="Refresh downloads"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M16 6V2.5M16 2.5h-3.5M16 2.5l-2.4 2.4A6.5 6.5 0 1 0 16 10"/></svg></button>
        </div>
      </header>

      <div id="error-banner" class="error-banner" role="alert" hidden></div>

      <section id="queue-section" class="queue-section" aria-label="Active downloads" hidden>
        <div class="queue-summary">
          <p id="queue-description" role="status" aria-live="polite" aria-atomic="true"></p>
          <div class="queue-actions">
            <button id="pause-all-button" class="quiet-button" type="button" hidden>Pause all</button>
            <button id="resume-all-button" class="quiet-button" type="button" hidden>Resume all</button>
            <button id="cancel-pending-button" class="danger-button" type="button" hidden>Cancel pending</button>
          </div>
        </div>
        <progress id="queue-progress" max="1" value="0" aria-label="Finished files in active batches" aria-describedby="queue-description"></progress>
      </section>

      <section aria-label="Download batches">
        <div id="history-tools" class="history-tools" hidden>
          <label id="history-search" class="history-search" hidden>
            <span class="visually-hidden">Search downloads</span>
            <input id="search-input" type="search" aria-controls="job-list" placeholder="Search files or website" maxlength="500" autocomplete="off">
          </label>
          <label id="history-status" class="history-status" hidden>
            <span class="visually-hidden">Download status</span>
            <select id="status-filter" aria-controls="job-list">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="complete">Completed</option>
              <option value="failed">Failed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <button id="retry-failed-button" class="quiet-button" type="button" hidden>Retry failed</button>
          <button id="clear-completed-button" class="quiet-button" type="button" title="Remove completed file details; keep batch summaries and downloaded files." hidden>Clear completed details</button>
        </div>
        <div id="history-empty" class="empty-state" role="status">
          <h2 id="history-empty-title">Loading downloads…</h2>
          <p id="history-empty-detail" hidden></p>
          <button id="reset-filters-button" class="quiet-button" type="button" hidden>Clear filters</button>
        </div>
        <div id="job-list" class="job-list"></div>
      </section>

      <details id="statistics-panel" class="statistics-panel" hidden>
        <summary>Statistics</summary>
        <table>
          <caption class="visually-hidden">Download results</caption>
          <thead><tr><th scope="col">Result</th><th scope="col">All time</th><th scope="col">Today</th></tr></thead>
          <tbody>
            <tr><th scope="row">Completed</th><td id="completed-stat">0</td><td id="completed-detail">0</td></tr>
            <tr><th scope="row">Failed</th><td id="failed-stat">0</td><td id="failed-detail">0</td></tr>
            <tr><th scope="row">Cancelled</th><td id="cancelled-stat">0</td><td id="cancelled-detail">0</td></tr>
            <tr><th scope="row">Downloaded</th><td id="bytes-stat">0 B</td><td id="bytes-detail">0 B</td></tr>
            <tr><th scope="row" title="Completed attempts divided by all completed, failed and cancelled attempts, including retries.">Success rate</th><td id="success-stat">—</td><td id="success-detail">—</td></tr>
          </tbody>
        </table>
      </details>
    </main>

    <script src="../shared/navigation.js"></script>
    <script src="history.js"></script>
  </body>
</html>
