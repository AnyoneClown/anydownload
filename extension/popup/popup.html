<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyDownload — Page images</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <img class="app-icon" src="../icons/image-downloader.svg" alt="">
        <div>
          <h1>Page images</h1>
          <p id="page-label">Scanning the current page…</p>
        </div>
        <div class="header-actions">
          <button id="open-window-button" class="open-window-button" type="button" title="Open in a resizable window" aria-label="Open in a resizable window" disabled>
            <span aria-hidden="true">↗</span>
            <span class="button-label">Open window</span>
          </button>
          <button id="rescan-button" class="icon-button" type="button" title="Scan the page again" aria-label="Scan the page again">↻</button>
        </div>
      </header>

      <section class="folder-panel" aria-labelledby="folder-label">
        <div class="folder-toolbar">
          <label id="folder-label" for="folder-input">Destination folder<span class="visually-hidden"> inside Firefox Downloads</span></label>
          <div class="folder-options">
            <label class="option-row" title="Show a Save As dialog when downloading exactly one image">
              <input id="ask-single-input" type="checkbox">
              <span>Save As for one image</span>
            </label>
            <label class="option-row" title="Include CSS background images on the next scan">
              <input id="backgrounds-input" type="checkbox" checked>
              <span>CSS backgrounds</span>
            </label>
          </div>
        </div>
        <div class="folder-input-row">
          <span aria-hidden="true">Downloads /</span>
          <input id="folder-input" type="text" value="Website images" maxlength="260" autocomplete="off" spellcheck="false" aria-describedby="folder-help">
        </div>
        <p id="folder-help" class="field-help" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="controls" aria-label="Image controls">
        <div class="summary-row">
          <strong id="summary-label">0 images</strong>
          <div id="selection-actions" class="selection-actions">
            <button id="ignored-button" class="text-button ignored-view-button" type="button" aria-pressed="false" disabled>Ignored (0)</button>
            <button id="clear-ignored-button" class="text-button danger-button" type="button" hidden>Restore all</button>
            <button id="select-all-button" class="text-button" type="button">Select all</button>
            <button id="select-none-button" class="text-button" type="button">Clear</button>
          </div>
        </div>
        <label class="search-box">
          <span class="visually-hidden">Filter images</span>
          <input id="filter-input" type="search" placeholder="Filter by URL, alt text, or type…" autocomplete="off">
        </label>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <main id="image-list" class="image-list" role="list" aria-label="Images found on this page"></main>

      <footer class="action-bar">
        <div>
          <strong id="selected-label">0 selected</strong>
          <span id="action-detail">Choose images to download</span>
        </div>
        <button id="download-button" class="primary-button" type="button" disabled>Download selected</button>
      </footer>
    </div>

    <script src="../shared/core.js"></script>
    <script src="../shared/collector.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
