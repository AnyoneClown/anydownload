<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyDownload — Page images</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <img class="app-icon" src="../icons/image-downloader.svg" alt="">
        <div>
          <h1>Page images</h1>
          <p id="page-label">Scanning the current page…</p>
        </div>
        <div class="header-actions">
          <button id="open-window-button" class="open-window-button" type="button" title="Open in a resizable window" aria-label="Open in a resizable window" disabled>
            <span aria-hidden="true">↗</span>
            <span class="button-label">Open window</span>
          </button>
          <button id="sidebar-button" class="icon-button sidebar-button" type="button" title="Open Firefox Sidebar" aria-label="Open Firefox Sidebar">◫</button>
          <button id="history-button" class="icon-button history-button" type="button" title="Download queue and statistics" aria-label="Open download queue and statistics">
            ⇩<span id="queue-badge" class="queue-badge" aria-hidden="true" hidden>0</span>
          </button>
          <button id="rescan-button" class="icon-button" type="button" title="Scan the page again" aria-label="Scan the page again">↻</button>
        </div>
      </header>

      <section class="folder-panel" aria-labelledby="folder-label">
        <div class="folder-toolbar">
          <label id="folder-label" for="folder-input">Destination folder<span class="visually-hidden"> inside Firefox Downloads</span></label>
          <div class="folder-options">
            <label class="option-row" title="Show a Save As dialog when downloading exactly one image">
              <input id="ask-single-input" type="checkbox">
              <span>Save As for one image</span>
            </label>
            <label class="option-row" title="Include CSS background images on the next scan">
              <input id="backgrounds-input" type="checkbox" checked>
              <span>CSS backgrounds</span>
            </label>
          </div>
        </div>
        <div class="folder-input-row">
          <span aria-hidden="true">Downloads /</span>
          <input id="folder-input" type="text" value="Website images" maxlength="260" autocomplete="off" spellcheck="false" aria-describedby="folder-help">
        </div>
        <p id="folder-help" class="field-help" role="status" aria-live="polite" hidden></p>
        <div class="filename-template-toolbar">
          <button id="filename-template-button" class="text-button" type="button" aria-expanded="false" aria-controls="filename-template-panel">Filename template</button>
          <span id="filename-template-preview" title="Filename preview">Example: image-0001.jpg</span>
        </div>
        <div id="filename-template-panel" class="filename-template-panel" hidden>
          <label for="filename-template-input">Template</label>
          <input id="filename-template-input" type="text" value="{filename}" maxlength="240" autocomplete="off" spellcheck="false" aria-describedby="filename-template-help">
          <p id="filename-template-help" class="field-help" role="status" aria-live="polite">Tokens: {filename}, {name}, {ext}, {index}, {hostname}, {page-title}, {width}, {height}, {date}</p>
        </div>
      </section>

      <section class="controls" aria-label="Image controls">
        <div class="summary-row">
          <strong id="summary-label">0 images</strong>
          <div id="selection-actions" class="selection-actions">
            <button id="ignored-button" class="text-button ignored-view-button" type="button" aria-pressed="false" disabled>Ignored (0)</button>
            <button id="clear-ignored-button" class="text-button danger-button" type="button" hidden>Restore all</button>
            <button id="select-all-button" class="text-button" type="button">Select all</button>
            <button id="select-none-button" class="text-button" type="button">Clear</button>
            <button id="bulk-download-button" class="text-button bulk-download-button" type="button" title="Download all selected images" hidden disabled>Download</button>
            <button id="archive-download-button" class="text-button archive-download-button" type="button" title="Download selected images as one ZIP archive" hidden disabled>ZIP</button>
          </div>
        </div>
        <label class="search-box">
          <span class="visually-hidden">Filter images</span>
          <input id="filter-input" type="search" placeholder="Filter by URL, alt text, or type…" autocomplete="off">
        </label>
        <div class="filter-toolbar">
          <label class="option-row photos-only-toggle" title="Hide likely logos, icons, avatars, trackers, and other non-photo assets">
            <input id="photos-only-input" type="checkbox">
            <span>Photos only</span>
          </label>
          <button id="smart-filters-button" class="text-button filter-toggle-button" type="button" aria-expanded="false" aria-controls="smart-filter-panel">Filters</button>
          <button id="duplicates-button" class="text-button filter-toggle-button" type="button" aria-expanded="false" aria-controls="duplicate-panel">Duplicates</button>
          <button id="live-capture-button" class="text-button live-capture-button" type="button" aria-pressed="false" title="Watch this gallery for images loaded while you scroll">Live capture</button>
          <button id="sidebar-follow-button" class="text-button sidebar-follow-button" type="button" title="Allow the Sidebar to follow every active webpage" hidden>Enable auto-follow</button>
        </div>
        <div id="smart-filter-panel" class="smart-filter-panel" hidden>
          <label class="compact-field">
            <span>Min width</span>
            <input id="min-width-input" type="number" min="0" max="1000000" step="1" inputmode="numeric" value="0">
          </label>
          <label class="compact-field">
            <span>Min height</span>
            <input id="min-height-input" type="number" min="0" max="1000000" step="1" inputmode="numeric" value="0">
          </label>
          <label class="compact-field">
            <span>Format</span>
            <select id="format-filter-select">
              <option value="any">Any</option>
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
              <option value="avif">AVIF</option>
              <option value="gif">GIF</option>
              <option value="svg">SVG</option>
            </select>
          </label>
          <label class="compact-field">
            <span>Orientation</span>
            <select id="orientation-filter-select">
              <option value="any">Any</option>
              <option value="landscape">Landscape</option>
              <option value="portrait">Portrait</option>
              <option value="square">Square</option>
            </select>
          </label>
          <label class="option-row unknown-size-toggle" title="Keep originals whose full dimensions have not been detected yet">
            <input id="include-unknown-input" type="checkbox" checked>
            <span>Include unknown sizes</span>
          </label>
          <button id="reset-filters-button" class="text-button" type="button">Reset</button>
        </div>
        <div id="duplicate-panel" class="duplicate-panel" hidden>
          <span id="duplicate-summary" role="status" aria-live="polite">No likely duplicates found.</span>
          <div class="duplicate-actions">
            <button id="deduplicate-button" class="text-button" type="button" disabled>Keep best selected</button>
            <label class="option-row">
              <input id="hide-duplicates-input" type="checkbox">
              <span>Hide extra copies</span>
            </label>
          </div>
        </div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <main id="image-list" class="image-list" role="list" aria-label="Images found on this page"></main>

      <footer class="action-bar">
        <div class="action-copy">
          <strong id="selected-label">0 selected</strong>
          <span id="action-detail">Choose images to download</span>
        </div>
        <div class="action-buttons">
          <button id="archive-footer-button" class="secondary-button" type="button" disabled>Download ZIP</button>
          <button id="download-button" class="primary-button" type="button" disabled>Download selected</button>
        </div>
      </footer>
    </div>

    <script src="../shared/core.js"></script>
    <script src="../shared/collector.js"></script>
    <script src="../shared/filters.js"></script>
    <script src="../shared/templates.js"></script>
    <script src="../shared/duplicates.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
