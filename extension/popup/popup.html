<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyDownload — Page media</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <img class="app-icon" src="../icons/image-downloader-illustrated-v2-96.png" alt="">
        <div class="header-copy">
          <h1>AnyDownload</h1>
          <p id="page-label">Scanning the current page…</p>
        </div>
        <div class="header-actions">
          <button id="open-window-button" class="open-window-button" type="button" title="Open in a resizable window" aria-label="Open in a resizable window" disabled>
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M8 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3M11 3h6v6M9 11l8-8"/></svg>
            <span class="button-label">Open window</span>
          </button>
          <button id="sidebar-button" class="icon-button sidebar-button" type="button" title="Open Firefox Sidebar" aria-label="Open Firefox Sidebar">
            <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M7.5 3v14"/></svg>
          </button>
          <button id="history-button" class="icon-button history-button" type="button" title="Download queue and statistics" aria-label="Open download queue and statistics">
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 2.5v9M6.5 8.5 10 12l3.5-3.5M3 14v2.5h14V14"/></svg>
            <span id="queue-badge" class="queue-badge" aria-hidden="true" hidden>0</span>
          </button>
        </div>
      </header>

      <section class="folder-panel" aria-labelledby="folder-label">
        <div class="folder-toolbar">
          <label id="folder-label" for="folder-input">Destination folder<span class="visually-hidden"> inside Firefox Downloads</span></label>
          <div class="folder-options">
            <label class="option-row" title="Show a Save As dialog when downloading exactly one file">
              <input id="ask-single-input" type="checkbox">
              <span>Save As for one file</span>
            </label>
            <label class="option-row" title="Include CSS background images on the next scan">
              <input id="backgrounds-input" type="checkbox" checked>
              <span>CSS backgrounds</span>
            </label>
          </div>
        </div>
        <div class="folder-input-row">
          <span aria-hidden="true">Downloads /</span>
          <input id="folder-input" type="text" value="Website media" maxlength="260" autocomplete="off" spellcheck="false" aria-describedby="folder-help">
        </div>
        <p id="folder-help" class="field-help" role="status" aria-live="polite" hidden></p>
        <div class="filename-template-toolbar">
          <button id="filename-template-button" class="text-button" type="button" aria-expanded="false" aria-controls="filename-template-panel">Filename template</button>
          <span id="filename-template-preview" title="Filename preview">Example: 0001-image-0001.jpg</span>
        </div>
        <div id="filename-template-panel" class="filename-template-panel" hidden>
          <label for="filename-template-input">Template</label>
          <input id="filename-template-input" type="text" value="{index}-{filename}" maxlength="240" autocomplete="off" spellcheck="false" aria-describedby="filename-template-help">
          <p id="filename-template-help" class="field-help" role="status" aria-live="polite">Tokens: {filename}, {name}, {ext}, {index}, {hostname}, {page-title}, {width}, {height}, {date}. The zero-padded {index} follows selected page order.</p>
        </div>
      </section>

      <section class="controls" aria-label="Media controls">
        <div class="summary-row">
          <strong id="summary-label">0 media files</strong>
          <div id="selection-actions" class="selection-actions">
            <button id="ignored-button" class="text-button ignored-view-button" type="button" aria-pressed="false" disabled>Ignored (0)</button>
            <button id="clear-ignored-button" class="text-button danger-button" type="button" hidden>Restore all</button>
            <button id="select-all-button" class="text-button" type="button">Select all</button>
            <button id="select-none-button" class="text-button" type="button">Clear</button>
          </div>
        </div>
        <label class="search-box">
          <span class="visually-hidden">Filter media</span>
          <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
          <input id="filter-input" type="search" placeholder="Filter by URL, label, or type…" autocomplete="off">
        </label>
        <div class="filter-toolbar">
          <button id="smart-filters-button" class="text-button filter-toggle-button" type="button" aria-expanded="false" aria-controls="smart-filter-panel">Filters</button>
          <button id="instagram-collections-button" class="text-button instagram-collections-button" type="button" title="Collect the profile owner's active story and highlights" hidden>Stories &amp; highlights</button>
          <button id="sidebar-follow-button" class="text-button sidebar-follow-button" type="button" title="Allow the Sidebar to follow every active webpage" hidden>Enable auto-follow</button>
        </div>
        <div id="smart-filter-panel" class="smart-filter-panel" hidden>
          <label class="compact-field">
            <span>Type</span>
            <select id="media-type-filter-select">
              <option value="any">Images &amp; videos</option>
              <option value="image">Images</option>
              <option value="video">Videos</option>
            </select>
          </label>
          <label class="option-row photos-only-toggle" title="Hide likely logos, icons, avatars, trackers, and other non-photo assets">
            <input id="photos-only-input" type="checkbox">
            <span>Photos only</span>
          </label>
          <label id="instagram-collection-filter-field" class="compact-field" hidden>
            <span>Instagram collection</span>
            <select id="instagram-collection-filter-select">
              <option value="all">All profile media</option>
              <option value="posts">Posts only</option>
              <option value="story">Current story only</option>
              <option value="highlights">All highlights</option>
            </select>
          </label>
          <label class="compact-field">
            <span>Format</span>
            <select id="format-filter-select">
              <option value="any">Any</option>
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
              <option value="avif">AVIF</option>
              <option value="gif">GIF</option>
              <option value="svg">SVG</option>
              <option value="mp4">MP4</option>
              <option value="webm">WebM</option>
              <option value="ogv">Ogg video</option>
              <option value="mov">MOV</option>
              <option value="m4v">M4V</option>
              <option value="mkv">MKV</option>
            </select>
          </label>
          <button id="reset-filters-button" class="text-button" type="button">Reset</button>
        </div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <main id="image-list" class="image-list" role="list" aria-label="Media found on this page"></main>

      <footer class="action-bar">
        <div class="action-copy">
          <strong id="selected-label">0 selected</strong>
          <span id="action-detail">Choose files to download</span>
        </div>
        <div class="action-buttons">
          <button id="archive-footer-button" class="secondary-button" type="button" disabled>Download ZIP</button>
          <button id="download-button" class="primary-button" type="button" disabled>Download selected</button>
        </div>
      </footer>
    </div>

    <script src="../shared/core.js"></script>
    <script src="../shared/collector.js"></script>
    <script src="../shared/fapfolder.js"></script>
    <script src="../shared/instagram.js"></script>
    <script src="../shared/youtube.js"></script>
    <script src="../shared/filters.js"></script>
    <script src="../shared/templates.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
